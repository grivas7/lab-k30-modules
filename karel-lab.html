<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab-K30 • Interactive Karel Robot Simulator</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-light: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #0b1120;
      border-bottom: 1px solid #1e293b;
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
    }
    .brand span { color: #60a5fa; }
    .nav-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--panel-light);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .ex-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .ex-btn {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--panel-light);
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .ex-btn:hover { color: var(--text); border-color: var(--accent); }
    .ex-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .ex-btn.done {
      border-color: var(--green);
      color: #6ee7b7;
    }

    main {
      flex: 1;
      max-width: 1320px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 24px;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 20px;
    }
    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--panel-light);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .mission-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .mission-title { font-size: 1.2rem; font-weight: 700; }
    .mode-badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .mode-COMPLETE { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid #3b82f6; }
    .mode-DEBUG { background: rgba(245, 158, 11, 0.2); color: #fcd34d; border: 1px solid #f59e0b; }
    .mode-BUILD { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border: 1px solid #10b981; }

    .instruction {
      background: #0f172a;
      border-left: 4px solid var(--accent);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.98rem;
      line-height: 1.45;
      color: #e2e8f0;
    }

    .quick-keys {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .quick-keys span {
      font-size: 0.8rem;
      color: var(--muted);
      margin-right: 4px;
    }
    .snippet-btn {
      background: #0f172a;
      color: #93c5fd;
      border: 1px solid #334155;
      padding: 5px 10px;
      border-radius: 6px;
      font-family: 'Consolas', monospace;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .snippet-btn:hover { background: #1e3a8a; color: white; }

    .editor-wrap {
      position: relative;
      flex: 1;
      min-height: 270px;
      display: flex;
      background: #0b1120;
      border: 1px solid #334155;
      border-radius: 10px;
      overflow: hidden;
    }
    .line-numbers {
      width: 42px;
      background: #0f172a;
      color: #64748b;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 15px;
      line-height: 1.55;
      padding: 12px 6px;
      text-align: right;
      user-select: none;
    }
    .line-numbers div.active-line {
      background: var(--accent);
      color: white;
      border-radius: 4px;
      padding-right: 4px;
    }
    textarea#code-editor {
      flex: 1;
      background: transparent;
      color: #f8fafc;
      border: none;
      outline: none;
      resize: none;
      padding: 12px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 15px;
      line-height: 1.55;
      tab-size: 2;
    }

    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    button.ctrl {
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s, opacity 0.15s;
    }
    button.ctrl:active { transform: scale(0.97); }
    .btn-run { background: var(--green); color: #052e16; }
    .btn-step { background: var(--accent); color: white; }
    .btn-reset { background: var(--panel-light); color: white; }
    .btn-hint { background: transparent; border: 1px solid var(--amber) !important; color: #fcd34d; }

    /* World Grid Styling */
    .world-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .bag-pill {
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #38bdf8;
      border: 1px solid #334155;
    }
    .grid-stage {
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0b1120;
      border-radius: 12px;
      padding: 18px;
      min-height: 310px;
      border: 1px solid #334155;
    }
    .karel-grid {
      display: grid;
      gap: 4px;
      background: #1e293b;
      padding: 8px;
      border-radius: 10px;
      border: 3px solid #475569;
    }
    .cell {
      width: 58px;
      height: 58px;
      background: #273549;
      border-radius: 6px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
    }
    .cell.goal-cell {
      border: 2px dashed var(--green);
      background: rgba(16, 185, 129, 0.12);
    }
    .cell.wall-N { border-top: 5px solid var(--red); }
    .cell.wall-S { border-bottom: 5px solid var(--red); }
    .cell.wall-E { border-right: 5px solid var(--red); }
    .cell.wall-W { border-left: 5px solid var(--red); }

    .beeper {
      width: 30px;
      height: 30px;
      background: #38bdf8;
      transform: rotate(45deg);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .beeper span {
      transform: rotate(-45deg);
      color: #0f172a;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .robot {
      position: absolute;
      font-size: 32px;
      line-height: 1;
      z-index: 5;
      transition: transform 0.2s;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
    }
    .dir-badge {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 11px;
      color: #fde047;
      font-weight: 800;
      z-index: 6;
    }

    .status-banner {
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 700;
      text-align: center;
      font-size: 1rem;
      background: #0f172a;
      color: var(--muted);
      border: 1px solid #334155;
    }
    .status-banner.success {
      background: rgba(16, 185, 129, 0.18);
      border-color: var(--green);
      color: #6ee7b7;
    }
    .status-banner.error {
      background: rgba(239, 68, 68, 0.18);
      border-color: var(--red);
      color: #fca5a5;
    }

    .goal-preview-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      gap: 12px;
    }
    .mini-grid {
      display: grid;
      gap: 2px;
      background: #1e293b;
      padding: 4px;
      border-radius: 6px;
      border: 1px solid #475569;
    }
    .mini-cell {
      width: 20px;
      height: 20px;
      background: #273549;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }
    .hint-box {
      display: none;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid var(--amber);
      color: #fde68a;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">🤖 Lab-K30 <span>Karel Interactive Simulator</span></div>
  <div class="nav-controls">
    <select id="lesson-select" aria-label="Select Lesson"></select>
    <div class="ex-tabs" id="ex-tabs"></div>
  </div>
</header>

<main>
  <!-- LEFT PANEL: CODE EDITOR -->
  <section class="card">
    <div class="mission-header">
      <div class="mission-title" id="ex-title">Exercise</div>
      <span class="mode-badge" id="ex-mode">COMPLETE</span>
    </div>

    <div class="instruction" id="ex-instruction"></div>
    <div class="hint-box" id="ex-hint"></div>

    <div class="quick-keys">
      <span>Quick Insert:</span>
      <button class="snippet-btn" onclick="insertCmd('move();')">move();</button>
      <button class="snippet-btn" onclick="insertCmd('turnLeft();')">turnLeft();</button>
      <button class="snippet-btn" onclick="insertCmd('pickBeeper();')">pickBeeper();</button>
      <button class="snippet-btn" onclick="insertCmd('putBeeper();')">putBeeper();</button>
    </div>

    <div class="editor-wrap">
      <div class="line-numbers" id="line-numbers"></div>
      <textarea id="code-editor" spellcheck="false"></textarea>
    </div>

    <div class="action-bar">
      <div class="btn-group">
        <button class="ctrl btn-run" onclick="runAll()">▶ Run</button>
        <button class="ctrl btn-step" onclick="stepOnce()">⏭ Step</button>
        <button class="ctrl btn-reset" onclick="resetWorld()">↺ Reset</button>
      </div>
      <button class="ctrl btn-hint" onclick="toggleHint()">💡 Hint</button>
    </div>
  </section>

  <!-- RIGHT PANEL: KAREL GRID & GOAL -->
  <section class="card">
    <div class="world-top">
      <div style="font-weight:700; font-size:1.05rem;">Karel World Arena</div>
      <div class="bag-pill" id="bag-count">💎 Beeper Bag: 0</div>
    </div>

    <div class="grid-stage">
      <div class="karel-grid" id="karel-grid"></div>
    </div>

    <div class="status-banner" id="status-banner">
      Edit or complete the code on the left, then press <strong>▶ Run</strong>!
    </div>

    <div class="goal-preview-row">
      <div>
        <div style="font-weight:700; font-size:0.95rem; color:#6ee7b7;">🎯 Goal Target State</div>
        <div style="font-size:0.85rem; color:var(--muted); margin-top:2px;">
          Match Karel's green square &amp; all diamond positions shown on the right.
        </div>
      </div>
      <div class="mini-grid" id="mini-goal-grid"></div>
    </div>
  </section>
</main>

<script src="karel-lessons-data.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  let currentLessonId = parseInt(urlParams.get('lesson')) || 1;
  if (!KAREL_LESSONS[currentLessonId]) currentLessonId = 1;
  let currentExIndex = 0;

  let worldState = null;
  let stepQueue = [];
  let runTimer = null;
  let completedSet = new Set();

  const lessonSelect = document.getElementById('lesson-select');
  const exTabs = document.getElementById('ex-tabs');
  const editor = document.getElementById('code-editor');
  const lineNumbers = document.getElementById('line-numbers');

  // Populate Lesson Dropdown
  Object.values(KAREL_LESSONS).forEach(les => {
    const opt = document.createElement('option');
    opt.value = les.id;
    opt.textContent = les.title;
    if (les.id === currentLessonId) opt.selected = true;
    lessonSelect.appendChild(opt);
  });

  lessonSelect.addEventListener('change', () => {
    currentLessonId = parseInt(lessonSelect.value);
    currentExIndex = 0;
    const newUrl = `${window.location.pathname}?lesson=${currentLessonId}`;
    window.history.replaceState({}, '', newUrl);
    renderExerciseTabs();
    loadExercise(0);
  });

  editor.addEventListener('input', updateLineNumbers);
  editor.addEventListener('scroll', () => { lineNumbers.scrollTop = editor.scrollTop; });

  function updateLineNumbers(activeLine = -1) {
    const lines = editor.value.split('\n');
    lineNumbers.innerHTML = lines.map((_, idx) => {
      const cls = (idx + 1 === activeLine) ? 'active-line' : '';
      return `<div class="${cls}">${idx + 1}</div>`;
    }).join('');
  }

  function insertCmd(snippet) {
    const start = editor.selectionStart;
    const end = editor.selectionEnd;
    const text = editor.value;
    editor.value = text.substring(0, start) + snippet + "\n  " + text.substring(end);
    editor.focus();
    editor.selectionStart = editor.selectionEnd = start + snippet.length + 3;
    updateLineNumbers();
  }

  function toggleHint() {
    const hb = document.getElementById('ex-hint');
    hb.style.display = (hb.style.display === 'block') ? 'none' : 'block';
  }

  function renderExerciseTabs() {
    const lesson = KAREL_LESSONS[currentLessonId];
    exTabs.innerHTML = '';
    lesson.exercises.forEach((ex, idx) => {
      const btn = document.createElement('button');
      const key = `${currentLessonId}-${idx}`;
      btn.className = 'ex-btn' + (idx === currentExIndex ? ' active' : '') + (completedSet.has(key) ? ' done' : '');
      btn.textContent = `Ex ${idx + 1}`;
      btn.onclick = () => loadExercise(idx);
      exTabs.appendChild(btn);
    });
  }

  function loadExercise(idx) {
    stopExecution();
    currentExIndex = idx;
    renderExerciseTabs();
    const ex = KAREL_LESSONS[currentLessonId].exercises[idx];
    document.getElementById('ex-title').textContent = ex.title;
    const modeEl = document.getElementById('ex-mode');
    modeEl.textContent = ex.mode === 'DEBUG' ? 'FIX THE BUG' : (ex.mode === 'COMPLETE' ? 'COMPLETE CODE' : 'WRITE CODE');
    modeEl.className = `mode-badge mode-${ex.mode}`;
    document.getElementById('ex-instruction').textContent = ex.instruction;
    const hb = document.getElementById('ex-hint');
    hb.textContent = "💡 Hint: " + ex.hint;
    hb.style.display = 'none';

    editor.value = ex.starterCode;
    updateLineNumbers();
    resetWorld();
    renderMiniGoal(ex);
  }

  function resetWorld() {
    stopExecution();
    stepQueue = [];
    const ex = KAREL_LESSONS[currentLessonId].exercises[currentExIndex];
    worldState = {
      rows: ex.rows,
      cols: ex.cols,
      r: ex.start.r,
      c: ex.start.c,
      dir: ex.start.dir,
      beepers: JSON.parse(JSON.stringify(ex.start.beepers)),
      walls: new Set(ex.start.walls),
      bag: 50 // Karel carries plenty of beepers when planting
    };
    updateLineNumbers();
    renderGrid();
    setStatus("Ready! Press ▶ Run or ⏭ Step to watch Karel.", "");
  }

  function setStatus(msg, type) {
    const sb = document.getElementById('status-banner');
    sb.innerHTML = msg;
    sb.className = 'status-banner' + (type ? ` ${type}` : '');
  }

  function renderGrid() {
    const ex = KAREL_LESSONS[currentLessonId].exercises[currentExIndex];
    const grid = document.getElementById('karel-grid');
    grid.style.gridTemplateColumns = `repeat(${worldState.cols}, 58px)`;
    grid.innerHTML = '';

    const dirArrows = { E: '➡', N: '⬆', W: '⬅', S: '⬇' };

    for (let r = 0; r < worldState.rows; r++) {
      for (let c = 0; c < worldState.cols; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (ex.goal.r === r && ex.goal.c === c) cell.classList.add('goal-cell');
        ['N','S','E','W'].forEach(d => {
          if (worldState.walls.has(`${r},${c},${d}`)) cell.classList.add(`wall-${d}`);
        });

        const bCount = worldState.beepers[`${r},${c}`] || 0;
        if (bCount > 0) {
          const bp = document.createElement('div');
          bp.className = 'beeper';
          bp.innerHTML = `<span>${bCount > 1 ? bCount : ''}</span>`;
          cell.appendChild(bp);
        }

        if (worldState.r === r && worldState.c === c) {
          const rob = document.createElement('div');
          rob.className = 'robot';
          rob.textContent = '🤖';
          cell.appendChild(rob);

          const db = document.createElement('div');
          db.className = 'dir-badge';
          db.textContent = dirArrows[worldState.dir];
          cell.appendChild(db);
        }
        grid.appendChild(cell);
      }
    }
  }

  function renderMiniGoal(ex) {
    const mg = document.getElementById('mini-goal-grid');
    mg.style.gridTemplateColumns = `repeat(${ex.cols}, 20px)`;
    mg.innerHTML = '';
    for (let r = 0; r < ex.rows; r++) {
      for (let c = 0; c < ex.cols; c++) {
        const mc = document.createElement('div');
        mc.className = 'mini-cell';
        if (ex.goal.r === r && ex.goal.c === c) {
          mc.style.background = '#10b981';
          mc.textContent = '🤖';
        } else if ((ex.goal.beepers[`${r},${c}`] || 0) > 0) {
          mc.style.color = '#38bdf8';
          mc.textContent = '◆';
        }
        mg.appendChild(mc);
      }
    }
  }

  // Safe Interpreter / Action Recorder
  function compileSteps() {
    const code = editor.value;
    const actions = [];
    const ex = KAREL_LESSONS[currentLessonId].exercises[currentExIndex];

    // Virtual state for evaluating sensors (frontIsClear, beepersPresent, etc.)
    const sim = {
      rows: ex.rows,
      cols: ex.cols,
      r: ex.start.r,
      c: ex.start.c,
      dir: ex.start.dir,
      beepers: JSON.parse(JSON.stringify(ex.start.beepers)),
      walls: new Set(ex.start.walls),
      bag: 50
    };

    let safetyCounter = 0;
    const MAX_STEPS = 200;

    function checkLimit() {
      if (++safetyCounter > MAX_STEPS) throw new Error("Infinite loop detected! Check your while/for condition.");
    }

    function isClear(r, c, dir) {
      if (sim.walls.has(`${r},${c},${dir}`)) return false;
      if (dir === 'E') return c + 1 < sim.cols && !sim.walls.has(`${r},${c+1},W`);
      if (dir === 'W') return c - 1 >= 0 && !sim.walls.has(`${r},${c-1},E`);
      if (dir === 'N') return r - 1 >= 0 && !sim.walls.has(`${r-1},${c},S`);
      if (dir === 'S') return r + 1 < sim.rows && !sim.walls.has(`${r+1},${c},N`);
      return false;
    }

    const api = {
      move: () => {
        checkLimit();
        if (!isClear(sim.r, sim.c, sim.dir)) {
          actions.push({ type: 'CRASH', msg: '💥 Crash! Karel hit a wall or edge!' });
          throw new Error("CRASH");
        }
        if (sim.dir === 'E') sim.c++;
        if (sim.dir === 'W') sim.c--;
        if (sim.dir === 'N') sim.r--;
        if (sim.dir === 'S') sim.r++;
        actions.push({ type: 'MOVE', r: sim.r, c: sim.c });
      },
      turnLeft: () => {
        checkLimit();
        const leftMap = { E: 'N', N: 'W', W: 'S', S: 'E' };
        sim.dir = leftMap[sim.dir];
        actions.push({ type: 'TURN', dir: sim.dir });
      },
      pickBeeper: () => {
        checkLimit();
        const key = `${sim.r},${sim.c}`;
        if (!sim.beepers[key] || sim.beepers[key] <= 0) {
          actions.push({ type: 'ERROR', msg: '⚠️ Error: No diamond on this square to pick up!' });
          throw new Error("NO_BEEPER");
        }
        sim.beepers[key]--;
        sim.bag++;
        actions.push({ type: 'PICK', key });
      },
      putBeeper: () => {
        checkLimit();
        const key = `${sim.r},${sim.c}`;
        sim.beepers[key] = (sim.beepers[key] || 0) + 1;
        actions.push({ type: 'PUT', key });
      },
      frontIsClear: () => isClear(sim.r, sim.c, sim.dir),
      frontIsBlocked: () => !isClear(sim.r, sim.c, sim.dir),
      beepersPresent: () => (sim.beepers[`${sim.r},${sim.c}`] || 0) > 0,
      noBeepersPresent: () => (sim.beepers[`${sim.r},${sim.c}`] || 0) === 0,
      beepersInBag: () => sim.bag > 0
    };

    try {
      const runner = new Function(
        'move', 'turnLeft', 'pickBeeper', 'putBeeper',
        'frontIsClear', 'frontIsBlocked', 'beepersPresent', 'noBeepersPresent', 'beepersInBag',
        `"use strict";\n${code}\nif (typeof main === "function") { main(); } else { throw new Error("Missing function main() { ... }"); }`
      );
      runner(
        api.move, api.turnLeft, api.pickBeeper, api.putBeeper,
        api.frontIsClear, api.frontIsBlocked, api.beepersPresent, api.noBeepersPresent, api.beepersInBag
      );
    } catch (err) {
      if (err.message !== "CRASH" && err.message !== "NO_BEEPER") {
        setStatus(`⚠️ Syntax / Code Error: ${err.message}`, "error");
        return null;
      }
    }
    return actions;
  }

  function applyOneAction(act) {
    if (act.type === 'MOVE') {
      worldState.r = act.r;
      worldState.c = act.c;
    } else if (act.type === 'TURN') {
      worldState.dir = act.dir;
    } else if (act.type === 'PICK') {
      worldState.beepers[act.key]--;
    } else if (act.type === 'PUT') {
      worldState.beepers[act.key] = (worldState.beepers[act.key] || 0) + 1;
    } else if (act.type === 'CRASH' || act.type === 'ERROR') {
      setStatus(act.msg, "error");
      stopExecution();
      return false;
    }
    renderGrid();
    return true;
  }

  function verifyGoal() {
    const ex = KAREL_LESSONS[currentLessonId].exercises[currentExIndex];
    const posOk = (worldState.r === ex.goal.r && worldState.c === ex.goal.c);
    const dirOk = (!ex.goal.dir || worldState.dir === ex.goal.dir);

    // Compare all beepers on grid
    let beepersOk = true;
    const allKeys = new Set([...Object.keys(worldState.beepers), ...Object.keys(ex.goal.beepers)]);
    allKeys.forEach(k => {
      const actual = worldState.beepers[k] || 0;
      const expected = ex.goal.beepers[k] || 0;
      if (actual !== expected) beepersOk = false;
    });

    if (posOk && dirOk && beepersOk) {
      completedSet.add(`${currentLessonId}-${currentExIndex}`);
      renderExerciseTabs();
      setStatus("🎉 Goal reached! Great job! Click the next exercise above.", "success");
    } else {
      setStatus("Almost there! Karel stopped, but doesn't match the Goal map yet. Check your steps!", "error");
    }
  }

  function stopExecution() {
    if (runTimer) {
      clearInterval(runTimer);
      runTimer = null;
    }
  }

  function runAll() {
    resetWorld();
    const actions = compileSteps();
    if (!actions) return;
    if (actions.length === 0) {
      setStatus("No commands ran! Write commands inside function main() { ... }", "error");
      return;
    }
    let idx = 0;
    runTimer = setInterval(() => {
      if (idx >= actions.length) {
        stopExecution();
        verifyGoal();
        return;
      }
      const ok = applyOneAction(actions[idx++]);
      if (!ok) return;
    }, 320);
  }

  function stepOnce() {
    if (stepQueue.length === 0) {
      resetWorld();
      const actions = compileSteps();
      if (!actions) return;
      stepQueue = actions;
    }
    if (stepQueue.length > 0) {
      const nextAct = stepQueue.shift();
      const ok = applyOneAction(nextAct);
      if (ok && stepQueue.length === 0) {
        verifyGoal();
      }
    }
  }

  // Initialize on load
  renderExerciseTabs();
  loadExercise(0);
</script>
</body>
</html>
